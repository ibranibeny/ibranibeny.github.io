---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta">{{ page.description }}</p>
  </header>
  <div class="post-content">
    {{ content | replace: '```mermaid', '<pre class="mermaid">' | replace: '```', '</pre>' }}
  </div>
</article>
